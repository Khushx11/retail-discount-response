name: Portfolio checks
on: [push, pull_request]

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the four VISUELLE dataset files
        working-directory: datasets/visuelle2
        run: sha256sum --check ../../docs/visuelle2.sha256
      - name: Verify the published report and presentation
        working-directory: docs/materials
        run: sha256sum --check SHA256SUMS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pandas==2.3.3 playwright==1.56.0
      - run: python -m unittest discover -s tests -v
      - run: python tests/browser_smoke.py
